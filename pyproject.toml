[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-offline-lab"
version = "0.1.0"
description = "DJ offline laboratory with guarded experimental Mixxx and learned controllers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "onnx>=1.16,<2", "onnxruntime>=1.18,<2"]
midi = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]
essentia = ["essentia>=2.1b6.dev1110"]

[project.scripts]
dj = "dj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
